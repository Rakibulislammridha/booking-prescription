# Booking to Prescription — production stack on one VPS (BRIEF §2: "VPS + Docker, S3-compatible storage,
# per-tenant daily DB dumps"). docs/DEPLOYMENT.md is the runbook; this file is the topology.
#
#   caddy ──▶ app (Octane/FrankenPHP :8000)          ┐
#         ──▶ reverb (:8080, ws.{central})            │ all from ONE image, role picked by docker/entrypoint.sh
#             horizon · scheduler · init · tls-ask   ┘
#   postgres 16 (booking + catalog, roles from docker/postgres/pg-roles.sql) · valkey 8 · meilisearch · minio (profile)
#
# Store choice: Valkey (the BSD-licensed, Redis 7.2-compatible fork) rather than Redis or Dragonfly. Horizon,
# the session/cache stores and the QueueState keys speak plain RESP and need nothing newer than 7.2; Valkey has an
# official image with `valkey-cli` for the healthcheck. Dragonfly is only the dev box's no-root workaround
# (scripts/dev-services.sh). Swapping to `redis:7-alpine` is a two-line change (image + healthcheck command).
#
# Read `docker/.env.production.example` → `.env` before `docker compose up`. Compose interpolates ${VAR} from it AND
# every app container receives it as env_file. Compose precedence: `environment:` > env_file > image ENV — so the
# few values pinned under `environment:` below are the ones that MUST be true inside a container.

name: bp

x-app: &app
  image: ${BP_IMAGE:-ghcr.io/your-org/booking-prescription}:${BP_TAG:-latest}
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  networks: [bp]
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"
  # storage/logs is shared: the `clinical` channel is a file channel (config/logging.php) and the init lock lives
  # there; storage/app/public holds clinic logos served at APP_URL/storage/… (ClinicUploads::brandingLogo).
  volumes:
    - app-logs:/app/storage/logs
    - app-public:/app/storage/app/public

x-app-depends: &app-depends
  init:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  valkey:
    condition: service_healthy
  meilisearch:
    condition: service_healthy

services:

  # ------------------------------------------------------------------------------------------------ edge
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_CENTRAL_DOMAIN: ${APP_CENTRAL_DOMAIN:?set APP_CENTRAL_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [bp]
    depends_on:
      app:
        condition: service_healthy
      tls-ask:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 256M

  # Caddy on-demand TLS gate: 200 only for live tenant hosts and verified custom domains (docker/tls-ask).
  tls-ask:
    <<: *app
    command: ["tls-ask"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes: []
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M

  # ------------------------------------------------------------------------------------------------ application
  # One-shot per deploy: migrate → catalog:migrate → tenants:migrate --seed → tenants:sync-search-settings.
  # Idempotent and serialised on a lock (docker/entrypoint.sh `run_init`). `docker compose run --rm init` re-runs it.
  init:
    <<: *app
    command: ["init"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  app:
    <<: *app
    command: ["app"]
    depends_on: *app-depends
    expose: ["8000"]
    # Synchronous prescription prints render in headless Chromium inside this container.
    shm_size: "512m"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # Horizon: supervisor-critical (critical), supervisor-pdf (pdf), supervisor-default (default, notifications,
  # search, reports, backups) — config/horizon.php. SIGTERM drains the current job; the pdf supervisor's timeout is
  # 150 s and a pg_dump can take minutes, hence the long grace period.
  horizon:
    <<: *app
    command: ["horizon"]
    depends_on: *app-depends
    shm_size: "512m"
    stop_grace_period: 180s
    healthcheck:
      # 0 running · 1 paused · 2 inactive (Laravel\Horizon\Console\StatusCommand)
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  scheduler:
    <<: *app
    command: ["scheduler"]
    depends_on: *app-depends
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' > /dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  reverb:
    <<: *app
    command: ["reverb"]
    depends_on:
      valkey:
        condition: service_healthy
    expose: ["8080"]
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ------------------------------------------------------------------------------------------------ data
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    # Only what the initdb hook needs (docker/postgres/initdb/01-roles-and-databases.sh) — not the whole .env.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8 --data-checksums"
      DB_DATABASE: ${DB_DATABASE:-booking}
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      CATALOG_DB_DATABASE: ${CATALOG_DB_DATABASE:-catalog}
      CATALOG_DB_USERNAME: ${CATALOG_DB_USERNAME:?set CATALOG_DB_USERNAME in .env}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD in .env}
      CATALOG_ADMIN_DB_USERNAME: ${CATALOG_ADMIN_DB_USERNAME:?set CATALOG_ADMIN_DB_USERNAME in .env}
      CATALOG_ADMIN_DB_PASSWORD: ${CATALOG_ADMIN_DB_PASSWORD:?set CATALOG_ADMIN_DB_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=500
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/pg-roles.sql:/bp/pg-roles.sql:ro
    networks: [bp]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    # Queues live here: append-only persistence, and NO eviction (an evicted key is a lost job or a logged-out desk).
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - valkey-data:/data
    networks: [bp]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512M

  meilisearch:
    image: getmeili/meilisearch:v1.53
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:?set MEILISEARCH_KEY in .env}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch-data:/meili_data
    networks: [bp]
    healthcheck:
      # The official image ships curl (its Dockerfile: `apk add … curl`).
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ------------------------------------------------------------------------------------------------ object storage
  # S3-compatible store for the `uploads`, `pdfs` and `backups` disks (ARCHITECTURE §8.7). COMPOSE_PROFILES=minio
  # in .env enables it; with an external S3/Wasabi/R2 leave the profile off and set AWS_ENDPOINT accordingly.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: [minio]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}
    volumes:
      - minio-data:/data
    networks: [bp]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 1G

  # Creates the three buckets and the 90-day lifecycle on the PDF bucket (ARCHITECTURE §8.7). Idempotent.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: [minio]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
      BP_UPLOADS_BUCKET: ${AWS_UPLOADS_BUCKET:-bp-uploads}
      BP_PDFS_BUCKET: ${AWS_PDFS_BUCKET:-bp-pdfs}
      BP_BACKUPS_BUCKET: ${AWS_BACKUPS_BUCKET:-bp-backups}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        for b in "$$BP_UPLOADS_BUCKET" "$$BP_PDFS_BUCKET" "$$BP_BACKUPS_BUCKET"; do
          mc mb --ignore-existing "local/$$b"
        done
        mc ilm rule ls "local/$$BP_PDFS_BUCKET" 2>/dev/null | grep -q . || mc ilm rule add --expire-days 90 "local/$$BP_PDFS_BUCKET"
        echo "buckets ready"
    networks: [bp]
    logging: *logging

networks:
  bp:
    driver: bridge
    ipam:
      config:
        # Fixed so TRUSTED_PROXIES=172.28.0.0/16 (.env) names exactly this network; change both together.
        - subnet: 172.28.0.0/16

volumes:
  postgres-data:
  valkey-data:
  meilisearch-data:
  minio-data:
  caddy-data:
  caddy-config:
  app-logs:
  app-public:
