; Booking to Prescription — PHP overrides on top of php.ini-production (Dockerfile, stage `base`).
; Applies to the FrankenPHP worker AND the CLI processes (horizon, scheduler, reverb, artisan).

; Uploaded patient documents are capped at 10 MB by config/patients.php (`documents.max_kb`); leave headroom for
; the multipart envelope. Anything larger is rejected by validation, not by PHP, so the error is translatable.
upload_max_filesize = 12M
post_max_size = 16M
max_file_uploads = 20

; A pg_dump stream, a Browsershot render and a Meilisearch reindex chunk all live inside one request/job.
; Horizon's per-supervisor `memory` (config/horizon.php) restarts a worker that grows past 128/256 MB anyway.
memory_limit = 512M

; Octane owns the request clock (config/octane.php `max_execution_time` = 30 s); CLI is unlimited by default.
max_execution_time = 60

; Clinic timestamps are stored in UTC (config/database.php `timezone`) and rendered in Asia/Dhaka by the app.
date.timezone = UTC

; Errors go to the container's stderr (LOG_CHANNEL=stderr does the same for the framework log).
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Session cookies are set by Laravel; PHP's own session module is unused but keep it strict anyway.
session.use_strict_mode = 1

; OPcache. The worker never re-reads a file that has not changed and the image is immutable, so timestamp
; validation is pure overhead. A redeploy is a new container. `enable_cli` covers Horizon/scheduler/reverb.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 32531
opcache.jit = off

; PHP's realpath cache: the autoloader resolves thousands of paths per boot.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; expose_php leaks the PHP version in a header; Caddy already hides Server.
expose_php = Off
