# Build the production image (Dockerfile) and push it to GitHub Container Registry on every version tag.
#
#   git tag v1.4.0 && git push origin v1.4.0
#     → ghcr.io/<owner>/<repo>:1.4.0, :1.4, :latest, :sha-<short>
#
# The Dockerfile runs the real `npm run build` and `composer install --no-dev`, so the artefact is exactly what
# compose.yaml runs (BP_IMAGE / BP_TAG in the VPS .env). `workflow_dispatch` builds a `:sha-…` image from any branch
# for a staging box without cutting a release. linux/amd64 only by default: every base image and package here is
# also published for arm64 (FrankenPHP, node, Debian chromium, PGDG), so add `linux/arm64` to `platforms` if the VPS
# is ARM — at the cost of a QEMU build that takes several times longer.
name: Docker image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Booking to Prescription
            org.opencontainers.image.description=Multi-tenant clinic SaaS (Laravel 12, Octane/FrankenPHP, Inertia/React)

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
